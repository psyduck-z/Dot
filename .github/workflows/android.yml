name: Android APK

# The APK is built here rather than locally because there is no Android SDK on
# the development machine — the runner supplies it. Debug builds are used for
# now: they need no signing secrets and install fine by sideloading.
on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: node --test --experimental-strip-types test/*.test.ts

      - name: Build web bundle
        # No API key is built in. The bundle is published publicly for
        # over-the-air updates, so a key here would be readable by anyone;
        # it is entered per device in Settings instead.
        run: node scripts/build.mjs

      - name: Publish web build for over-the-air updates
        # The APK is a WebView around this bundle, so shipping a new bundle is
        # usually enough - no reinstall. Host these two files anywhere the
        # watch can reach and point Settings > Updates at version.json.
        run: |
          mkdir -p web
          cp public/bundle.js public/index.html web/
          # jq rather than printf: commit subjects contain quotes and
          # apostrophes that would otherwise produce invalid JSON.
          SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          NOTES=$(git log -1 --pretty=%s)
          jq -n --arg v "$SHA" --arg n "$NOTES" '{version: $v, bundle: "bundle.js", notes: $n}' > web/version.json
          cat web/version.json

      - uses: actions/upload-artifact@v4
        with:
          name: dot-web
          path: web/*
          if-no-files-found: error

      - name: Stage web build as Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -r public/. android/app/src/main/assets/
          ls -la android/app/src/main/assets

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/dot-${GITHUB_SHA::7}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: dot-apk
          path: dist/*.apk
          if-no-files-found: error
