name: Android APK

# The APK is built here rather than locally because there is no Android SDK on
# the development machine — the runner supplies it. Release builds, signed with
# the keystore in the repository: a debuggable APK signed by a throwaway
# certificate is most of what makes a sideloaded app look harmful, and this one
# has to ask for permission to install APKs, which is the rest of it.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: node --test --experimental-strip-types test/*.test.ts

      - name: Build web bundle
        # No API key is built in. The bundle is published publicly for
        # over-the-air updates, so a key here would be readable by anyone;
        # it is entered per device in Settings instead.
        run: node scripts/build.mjs

      - name: Stage web build as Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -r public/. android/app/src/main/assets/
          ls -la android/app/src/main/assets

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        working-directory: android
        # The run number becomes the versionCode. Android will not install an
        # APK whose versionCode is not higher than the installed one, so a
        # constant would make the in-app installer useless.
        env:
          DOT_VERSION_CODE: ${{ github.run_number }}
          DOT_VERSION_NAME: ${{ github.run_number }}-${{ github.sha }}
        # Release rather than debug: a debuggable APK is one of the things
        # Play Protect weighs when deciding a sideloaded app is harmful, and
        # this one has to ask for permission to install APKs, which is the
        # other. Signed with the same key either way, so the build type can
        # change without forcing a reinstall.
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/dot-${GITHUB_SHA::7}.apk"
          ls -la dist

      - name: Publish web build and APK for over-the-air updates
        # Runs after the APK exists so the same publish carries both. A new
        # bundle covers most changes with no reinstall; anything touching the
        # Android shell needs the APK, which the app can now fetch and hand to
        # the system installer itself.
        run: |
          mkdir -p web
          cp public/bundle.js public/index.html web/
          cp android/app/build/outputs/apk/release/app-release.apk web/dot.apk
          # jq rather than printf: commit subjects contain quotes and
          # apostrophes that would otherwise produce invalid JSON.
          SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          NOTES=$(git log -1 --pretty=%s)
          jq -n --arg v "$SHA" --arg n "$NOTES"                 --argjson a ${{ github.run_number }}              '{version: $v, bundle: "bundle.js", notes: $n, apk: "dot.apk", apkVersion: $a}'              > web/version.json
          cat web/version.json
          ls -la web

      - uses: actions/upload-artifact@v4
        with:
          name: dot-web
          path: web/*
          if-no-files-found: error

      - name: Publish to gh-pages
        # Serves the files the in-app updater fetches. Only from the default
        # branch: a build from a side branch should not become what every
        # watch downloads. Uses the workflow's own token, so no PAT is needed.
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          keep_files: false

      - uses: actions/upload-artifact@v4
        with:
          name: dot-apk
          path: dist/*.apk
          if-no-files-found: error
